services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"

  api:
    profiles: ["backend"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: "3001"
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@enzo-palermo.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: mysql://${DB_USER:-marmiton}:${DB_PASSWORD:-}@db:3306/${DB_NAME:-marmiton}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${UPLOADS_PATH:?UPLOADS_PATH required}
        target: /app/uploads
        bind:
          create_host_path: false
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:3001"

  db:
    profiles: ["backend"]
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-marmiton}
      MARIADB_USER: ${DB_USER:-marmiton}
      MARIADB_PASSWORD: ${DB_PASSWORD:-}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
    volumes:
      - type: bind
        source: ${DB_DATA_PATH:?DB_DATA_PATH required}
        target: /var/lib/mysql
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
