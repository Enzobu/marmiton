<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffdf9" />
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('petitsplats.theme') || 'system';
          var isDark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#161b18' : '#fffdf9');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta name="description" content="Les Petits Plats, votre carnet de recettes maison." />
    <title>Les Petits Plats — Recettes maison</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
