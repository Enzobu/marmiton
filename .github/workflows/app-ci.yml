name: App CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "package.json"
      - "compose.yml"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "package.json"
      - "compose.yml"
      - ".github/workflows/app-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
