name: CI - agent-rules

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rules:
    name: Validate rule catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate catalog, references and counts
        run: python3 agent/scripts/validate_repository.py
      - name: Check Python syntax
        run: python3 -m py_compile agent/scripts/validate_repository.py agent/scripts/validate_skills.py agent/tests/test_dokploy.py agent/tests/test_skill_configurator.py agent/tests/test_skill_sync.py agent/scripts/sync_skills.py agent/skills/project-rules-configurator/scripts/configure.py
      - name: Validate Skills format and references
        run: python3 agent/scripts/validate_skills.py
      - name: Check Bash syntax
        run: bash -n scripts/dokploy_deploy.sh agent/scripts/dokploy_deploy.sh agent/scripts/init.sh agent/tests/test_init.sh
      - name: Offline deployment regression tests
        run: python3 -m unittest discover -s agent/tests -p 'test_*.py' -v
      - name: Offline Skills tests
        run: python3 -m unittest discover -s agent/tests -p 'test_skill_*.py' -v
      - name: Offline Bash initialization regression tests
        run: bash agent/tests/test_init.sh
      - name: Offline native API auth scripting tests
        run: node --test agent/tests/test_api_auth.js

  app:
    name: Validate Marmiton application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ci-required:
    name: ci-required
    if: always()
    needs: [rules, app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert all required jobs succeeded
        env:
          RULES_RESULT: ${{ needs.rules.result }}
          APP_RESULT: ${{ needs.app.result }}
        run: |
          test "$APP_RESULT" = success || { echo "Application check did not succeed: $APP_RESULT"; exit 1; }
          test "$RULES_RESULT" = success || {
            echo "Required rules check did not succeed: $RULES_RESULT"
            exit 1
          }

  deploy-prod:
    name: Deploy production (Dokploy)
    # Activation volontaire : définir CD_ENABLED=true dans les Variables GitHub.
    # Aucun déploiement depuis PR, dev ou déclenchement manuel.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CD_ENABLED == 'true' }}
    needs: ci-required
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    timeout-minutes: 20
    concurrency:
      group: dokploy-production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Preflight required configuration
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
        run: |
          test -n "$DOKPLOY_URL" || { echo "::error::Missing DOKPLOY_URL variable"; exit 1; }
          test -n "$DOKPLOY_API_KEY" || { echo "::error::Missing DOKPLOY_API_KEY secret"; exit 1; }
          test -n "$DOKPLOY_COMPOSE_ID" || { echo "::error::Missing DOKPLOY_COMPOSE_ID secret"; exit 1; }
      - name: Trigger Dokploy and check deployment completion
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          EXPECTED_SOURCE_REF: ${{ github.ref }}
          APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
        run: bash scripts/dokploy_deploy.sh
